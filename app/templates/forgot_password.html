<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f6fb;
            margin: 0;
            padding: 24px;
            color: #1f2937;
        }
        .card {
            max-width: 520px;
            margin: 30px auto;
            background: #ffffff;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
        }
        form {
            display: grid;
            gap: 10px;
            margin-bottom: 14px;
        }
        label {
            font-weight: 600;
            margin-top: 6px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #c9d5e5;
            border-radius: 8px;
            font: inherit;
            background: #fff;
        }
        button {
            margin-top: 8px;
            border: 0;
            border-radius: 8px;
            background: #1d4ed8;
            color: #fff;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #1e40af;
        }
        .error {
            color: #b91c1c;
            background: #fee2e2;
            border: 1px solid #fecaca;
            padding: 8px;
            border-radius: 8px;
        }
        .message {
            color: #14532d;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            padding: 8px;
            border-radius: 8px;
        }
        a {
            color: #1d4ed8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Forgot Password</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        {% if not token %}
            <form method="post" action="/forgot-password">
                {% csrf_token %}
                <label for="email">Email</label>
                <input type="text" id="email" name="email">
                <button type="submit">Continue</button>
            </form>
        {% endif %}

        {% if token %}
            <form method="post" action="/forgot-password?token={{ token }}">
                {% csrf_token %}
                <label for="new_password">New password</label>
                <input type="text" id="new_password" name="new_password">
                <button type="submit">Reset password</button>
            </form>
        {% endif %}

        <p><a href="/login">Back to login</a></p>
    </div>
</body>
</html>
